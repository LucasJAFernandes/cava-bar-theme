# Base configuration for cava used by cava-bar.
# The number of bars comes from style.conf (bars=) and the audio source is appended
# added automatically, so do not put an [input] section here.
[general]
bars = 64
framerate = 30

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
